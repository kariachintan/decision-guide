name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest --cov=decision_guide --cov-report=term-missing
      - name: Smoke-test the offline demo
        run: |
          decision-guide validate
          decision-guide recommend --category chair --budget 350 --priority ergonomics --priority quiet
